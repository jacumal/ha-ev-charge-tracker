name: Validate integration

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant pytest
      - name: Compile Python files
        run: python -m compileall -q custom_components tests
      - name: Validate Lovelace card JavaScript syntax
        run: node --check custom_components/ev_charge_tracker/frontend/ev-charge-tracker-card.js
      - name: Validate translation files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path("custom_components/ev_charge_tracker/strings.json").read_text())
          base_fields = set(base["config"]["step"]["user"]["data"])
          base_descriptions = set(base["config"]["step"]["user"]["data_description"])
          for path in ("translations/es.json", "translations/en.json"):
              data = json.loads((Path("custom_components/ev_charge_tracker") / path).read_text())
              step = data["config"]["step"]["user"]
              assert set(step["data"]) == base_fields, f"{path}: field labels differ"
              assert set(step["data_description"]) == base_descriptions, f"{path}: field descriptions differ"
              assert data.get("options", {}).keys() == base.get("options", {}).keys(), f"{path}: options steps differ"
          PY
      - name: Import integration modules
        env:
          PYTHONPATH: .
        run: python -c "from custom_components.ev_charge_tracker import config_flow, coordinator, button, sensor"
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest -q
