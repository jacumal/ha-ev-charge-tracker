name: Render ChargeTrack brand icons

on:
  push:
    branches:
      - feature/beta-10-centered-rounded-brand-icons
    paths:
      - "custom_components/ev_charge_tracker/brand/*.svg"
      - "custom_components/ev_charge_tracker/brand/*.png"
      - "scripts/render_brand_icons.py"
      - ".github/workflows/render-brand-icons.yml"
  pull_request:
    paths:
      - "custom_components/ev_charge_tracker/brand/*.svg"
      - "custom_components/ev_charge_tracker/brand/*.png"
      - "scripts/render_brand_icons.py"
      - ".github/workflows/render-brand-icons.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Verify committed PNG assets match SVG masters
        run: python scripts/render_brand_icons.py --check
