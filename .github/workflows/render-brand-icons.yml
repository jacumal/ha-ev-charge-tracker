name: Render ChargeTrack brand icons

on:
  push:
    branches:
      - feature/beta-10-centered-rounded-brand-icons
    paths:
      - "custom_components/ev_charge_tracker/brand/*.svg"
      - "scripts/render_brand_icons.py"
      - ".github/workflows/render-brand-icons.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Render PNG assets
        run: python scripts/render_brand_icons.py
      - name: Commit generated PNG assets
        run: |
          if [[ -n "$(git status --porcelain custom_components/ev_charge_tracker/brand)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/ev_charge_tracker/brand/icon.png custom_components/ev_charge_tracker/brand/dark_icon.png custom_components/ev_charge_tracker/brand/icon@2x.png custom_components/ev_charge_tracker/brand/dark_icon@2x.png
            git commit -m "Render centered rounded ChargeTrack brand icons"
            git push
          fi
